# Configuração do projeto Supabase (versionada).
# Ref do projeto vinculado (Dashboard → Project Settings → Reference ID).
project_id = "kbyobwxpsyntfygtqjir"

# --- E-mails de autenticação ---------------------------------------------------
# Substituem o template padrão do Supabase (em inglês, sem estilo) pela mesma
# casca visual das Edge Functions de e-mail (ver supabase/functions/_shared/email.ts)
# — não dá para reaproveitar o código de lá: estes são arquivos estáticos com
# variáveis Go template ({{ .ConfirmationURL }}), renderizados pelo próprio
# Supabase Auth, sem passar por nenhuma função nossa.
# Publicar com: supabase config push (ou colar o HTML manualmente em
# Authentication → Email Templates, se o projeto não usar config declarativo).
[auth.email.template.recovery]
subject = "Redefina sua senha — DinPrev"
content_path = "./templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirme seu e-mail — DinPrev"
content_path = "./templates/confirmation.html"

# --- Edge Functions -----------------------------------------------------------
# A stripe-webhook recebe chamadas do Stripe, que NÃO enviam um JWT do Supabase
# (apenas o header stripe-signature). Por isso o verify_jwt precisa ficar OFF,
# senão a plataforma rejeita com 401 antes do código rodar. A segurança aqui é
# garantida pela verificação da assinatura do Stripe (constructEventAsync).
[functions.stripe-webhook]
verify_jwt = false

# As demais funções autenticam o usuário pelo JWT e devem mantê-lo ligado.
[functions.create-checkout-session]
verify_jwt = true

[functions.customer-portal]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Assistente de IA: só usuários logados podem gastar tokens da OpenAI.
[functions.ai-assistant]
verify_jwt = true

# Transcrição de áudio (nota de voz do assistente): idem, só usuário logado.
[functions.ai-transcribe]
verify_jwt = true

# Resumo mensal em PDF por e-mail: exige JWT e manda só para o e-mail da conta.
[functions.month-report]
verify_jwt = true

# ASAAS — gateway de pagamento (substitui o Stripe para novos assinantes).
# Criar assinatura e cancelar exigem usuário logado (JWT).
[functions.asaas-create-subscription]
verify_jwt = true

[functions.asaas-cancel]
verify_jwt = true

# O webhook do ASAAS não envia JWT do Supabase — a segurança é o token conferido
# no header `asaas-access-token` (ASAAS_WEBHOOK_TOKEN). Igual ao stripe-webhook.
[functions.asaas-webhook]
verify_jwt = false

# Painel administrativo: exige JWT (usuário logado) e, dentro da função, confere
# que o e-mail está em ADMIN_EMAIL antes de usar o service_role.
[functions.admin]
verify_jwt = true

# Programa de indicação: código + estatísticas do usuário logado.
[functions.referral]
verify_jwt = true
